version: 2

# We SHA-pin every `uses:` in workflows for supply-chain hygiene (closes the
# tag-hijack attack vector — see Tj-actions, Codecov 2021). Dependabot watches
# upstream releases and opens PRs to bump pinned SHAs so we don't have to
# track them manually.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Roll all dev-only bumps into one PR per week.
      dev-deps:
        dependency-type: development
