name: build-program

# Reusable + manually-dispatchable: build the TraceDigest UE Program on
# Linux + Windows and upload tarballs/zips as workflow artifacts.
#
# This workflow is *expensive* — full UE source clone + Setup is 20–40 min
# per platform — so it does NOT run on every push. Trigger by:
#   * pushing a `v*` tag (release.yml calls this workflow)
#   * the "Run workflow" button in the Actions UI (workflow_dispatch)
#
# Required secrets:
#   * UE_TOKEN — Personal Access Token belonging to a GitHub account that
#                has accepted Epic's EULA and joined the EpicGames org
#                (without that, EpicGames/UnrealEngine is invisible).
#                Scope: `repo`.

on:
  workflow_dispatch:
    inputs:
      ue_branch:
        description: 'Branch of EpicGames/UnrealEngine to build against (e.g. 5.7, 5.6, release).'
        type: string
        default: '5.7'
      version_tag:
        description: 'Version string used in artifact filenames. Default: SHA prefix.'
        type: string
        default: ''
  workflow_call:
    inputs:
      ue_branch:
        type: string
        default: '5.7'
      version_tag:
        type: string
        default: ''
    secrets:
      UE_TOKEN:
        required: true

permissions:
  contents: read

# Resolve a sane version tag to embed in artifact filenames. Falls back to the
# short commit sha if neither workflow_dispatch nor workflow_call supplied one.
# `INPUTS_*` env vars carry workflow_dispatch inputs into the runner without
# expanding them inside `run:` scripts (which would be shell-injection-prone).
env:
  VERSION_TAG: ${{ inputs.version_tag != '' && inputs.version_tag || github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
  INPUTS_UE_BRANCH: ${{ inputs.ue_branch }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            runner: ubuntu-latest
            platform: Linux
          - label: windows
            runner: windows-latest
            platform: Win64

    steps:
      - name: Checkout this repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src

      # Validate every workflow-dispatch / tag-derived input before it lands
      # in a shell. Both can become parts of git refs, filenames, and (worst
      # case) shell command lines later in the workflow. We allow a narrow
      # character class: alphanumerics + `._/-+v`. Catches `;`, `$`, `` ` ``,
      # quotes, spaces, newlines — anything that could break out of a token.
      - name: Validate workflow inputs
        shell: bash
        run: |
          for name in INPUTS_UE_BRANCH VERSION_TAG; do
            val="${!name}"
            if ! [[ "$val" =~ ^[A-Za-z0-9._/+-]+$ ]]; then
              echo "::error::$name='$val' contains forbidden characters; expected [A-Za-z0-9._/+-]+"
              exit 1
            fi
          done

      # Clone EpicGames/UnrealEngine without baking the PAT into the on-disk
      # remote URL. `http.extraheader` carries the credential for THIS clone
      # call only — it's never written into ue/.git/config — so no scrub step
      # is needed afterwards, and there's no window in which a future log/cache
      # step could persist the token. GitHub Actions still masks the token in
      # log output via the secret-mask filter.
      #
      # INPUTS_UE_BRANCH is already validated by the prior step so we can
      # interpolate it into the git arg directly.
      - name: Clone UnrealEngine
        env:
          UE_TOKEN: ${{ secrets.UE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$UE_TOKEN" ]; then
            echo "::error::UE_TOKEN secret is missing. See .github/workflows/build.yml header for setup."
            exit 1
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$UE_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH_HEADER" \
              clone --depth=1 --branch="$INPUTS_UE_BRANCH" \
              https://github.com/EpicGames/UnrealEngine.git ue
          git -C ue log -1 --oneline

      # Two non-obvious requirements when running Setup non-interactively:
      #   1. --force, not the default --prompt — without it the `read` against
      #      a non-TTY returns EOF and GitDependencies skips overwrite checks.
      #   2. GitDependencies' platform filter is --exclude=<folder>, NOT
      #      --exclude-target-platform=<X>. The latter looks reasonable but
      #      isn't recognised; GitDependencies then prints "Invalid command
      #      line parameter" and EXITS 0, so Setup.sh continues happily even
      #      though it has downloaded nothing. Then Build.sh later fails
      #      looking for the bundled DotNet SDK that was never fetched.
      - name: Setup UE deps (Linux)
        if: runner.os == 'Linux'
        working-directory: ue
        run: |
          ./Setup.sh --force --threads=$(nproc) \
            --exclude=Mac \
            --exclude=IOS \
            --exclude=Android \
            --exclude=TVOS \
            --exclude=VisionOS \
            --exclude=Win64

      # On Windows we skip Setup.bat and call GitDependencies.exe directly:
      # Setup.bat's error path is `pause` (wait-for-keypress), which would
      # hang the job until the 6h GH Actions timeout if GitDependencies ever
      # legitimately fails. Setup.bat's other duties (vc_redist install,
      # UnrealVersionSelector register, git hooks) aren't needed for a
      # headless Program build on a runner that already has MSVC + the C++
      # redistributable installed.
      - name: Setup UE deps (Windows)
        if: runner.os == 'Windows'
        working-directory: ue
        shell: cmd
        run: |
          Engine\Binaries\DotNET\GitDependencies\win-x64\GitDependencies.exe ^
            --force --threads=%NUMBER_OF_PROCESSORS% ^
            --exclude=Mac ^
            --exclude=IOS ^
            --exclude=Android ^
            --exclude=TVOS ^
            --exclude=VisionOS ^
            --exclude=Linux

      # UnrealBuildTool is C# source that has to be compiled before Build.sh
      # can invoke it. A source clone doesn't ship UBT.dll prebuilt and
      # Build.sh only auto-builds it if `-buildubt` is in argv — which we
      # aren't passing. BuildUBT.{sh,bat} is the canonical bootstrap script
      # (GenerateProjectFiles.sh runs the same thing internally).
      - name: Build UnrealBuildTool (Linux)
        if: runner.os == 'Linux'
        working-directory: ue
        run: Engine/Build/BatchFiles/BuildUBT.sh

      - name: Build UnrealBuildTool (Windows)
        if: runner.os == 'Windows'
        working-directory: ue
        shell: cmd
        run: Engine\Build\BatchFiles\BuildUBT.bat

      # Drop ue-program into the engine source tree. Symlink on Linux, copy on
      # Windows (symlinks need Developer Mode or admin, and we don't want to
      # rely on either being on by default on the runner).
      - name: Stage ue-program into engine (Linux)
        if: runner.os == 'Linux'
        run: ln -s "$GITHUB_WORKSPACE/src/ue-program/TraceDigest" "ue/Engine/Source/Programs/TraceDigest"

      - name: Stage ue-program into engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item -Recurse src/ue-program/TraceDigest ue/Engine/Source/Programs/TraceDigest

      - name: Build TraceDigest (Linux)
        if: runner.os == 'Linux'
        working-directory: ue
        run: Engine/Build/BatchFiles/Linux/Build.sh TraceDigest ${{ matrix.platform }} Development

      - name: Build TraceDigest (Windows)
        if: runner.os == 'Windows'
        working-directory: ue
        shell: cmd
        run: Engine\Build\BatchFiles\Build.bat TraceDigest ${{ matrix.platform }} Development

      # Monolithic link: TraceDigest is a single self-contained binary, no
      # side-by-side modules. We bundle the binary plus the small .target
      # manifest (UBT metadata, useful for diagnostics). Debug symbols
      # (.debug/.sym/.pdb) are intentionally excluded to keep the archive
      # small; people who need them can rebuild locally.
      #
      # `$VERSION_TAG` / `$INPUTS_UE_BRANCH` are read from the workflow-level
      # `env:` block (validated by the clone step) — NOT interpolated via
      # `${{ inputs.x }}` here, to avoid shell injection on workflow_dispatch.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          archive="TraceDigest-${VERSION_TAG}-ue${INPUTS_UE_BRANCH}-linux-x64.tar.gz"
          cd ue/Engine/Binaries/Linux
          tar -czf "$GITHUB_WORKSPACE/$archive" TraceDigest TraceDigest.target
          ls -la "$GITHUB_WORKSPACE/$archive"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PowerShell reads env vars via $env:NAME.
          $archive = "TraceDigest-$env:VERSION_TAG-ue$env:INPUTS_UE_BRANCH-windows-x64.zip"
          $bin = "ue\Engine\Binaries\Win64"
          $items = @(
            "$bin\TraceDigest.exe",
            "$bin\TraceDigest.target"
          )
          Compress-Archive -Path $items -DestinationPath $archive -Force
          Get-Item $archive

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracedigest-${{ matrix.label }}
          path: TraceDigest-*.${{ runner.os == 'Linux' && 'tar.gz' || 'zip' }}
          if-no-files-found: error
          retention-days: 7
