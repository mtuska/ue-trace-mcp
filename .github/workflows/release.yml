name: release

# Triggered by pushing a semver tag like `v0.3.1`. Three phases run in sequence:
#   1. validate         — refuse if package.json version doesn't match the tag
#   2. build            — call build.yml to produce Linux + Windows binaries
#   3. publish-and-release — npm publish the mcp-server, then create the GH
#                            release with all binaries attached
#
# Required secrets:
#   * UE_TOKEN — EpicGames-org PAT (see build.yml). Without it the build
#                phase fails before publishing/releasing.
#
# No NPM token is needed. The `publish` step uses npm's OIDC-based Trusted
# Publishing: GitHub mints a short-lived ID token (id-token: write permission
# below), npm verifies it against the trusted publisher config attached to
# the `ue-trace-mcp` package on npmjs.com. Setup steps for the maintainer:
#   1. Publish v0.3.0 once manually from your laptop so the package name is
#      claimed. Then on npmjs.com → package → "Trusted Publishers", add this
#      repo (mtuska/ue-trace-mcp) and workflow filename (release.yml).
#   2. After that, every tag-driven release publishes with provenance and
#      no long-lived token.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub release
  id-token: write   # to allow npm provenance if/when we enable it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse to release if mcp-server/package.json version drifts from the tag.
  # Stops "I tagged v0.3.1 but forgot to bump the package" mistakes that would
  # otherwise publish stale content to npm.
  validate:
    name: validate tag matches package.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Derive expected version
        id: derive
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./mcp-server/package.json').version")
          echo "tag=$tag pkg=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match mcp-server/package.json version $pkg"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # Build binaries via the reusable workflow. Inherits UE_TOKEN.
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      ue_branch: '5.7'
      version_tag: v${{ needs.validate.outputs.version }}
    secrets:
      UE_TOKEN: ${{ secrets.UE_TOKEN }}

  # Publish the TypeScript package to npm and create the GitHub release with
  # all binary tarballs/zips attached. Both run from the same job so a npm
  # publish failure stops us before creating a half-published release.
  publish-and-release:
    name: publish to npm + create GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install deps
        working-directory: mcp-server
        run: npm ci

      # The canonical LICENSE lives at the repo root. Copy it into the npm
      # package so registry tooling and users see the license without having
      # to navigate to GitHub.
      - name: Stage LICENSE into npm package
        run: cp LICENSE mcp-server/LICENSE

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          # Flatten: all of tracedigest-linux/*.tar.gz, tracedigest-windows/*.zip
          # end up under artifacts/<name>/<file>.
          merge-multiple: false

      - name: Inspect artifacts
        run: find artifacts -type f -printf '%p (%s bytes)\n'

      # Defense against silent matrix breakage: refuse to release unless we
      # got exactly one Linux tarball and one Windows zip.
      - name: Assert artifact completeness
        run: |
          tgz_count=$(find artifacts -name '*.tar.gz' | wc -l)
          zip_count=$(find artifacts -name '*.zip' | wc -l)
          echo "tarballs=$tgz_count zips=$zip_count"
          if [ "$tgz_count" != "1" ] || [ "$zip_count" != "1" ]; then
            echo "::error::expected exactly one .tar.gz and one .zip; got $tgz_count tarballs, $zip_count zips"
            exit 1
          fi

      # Compute SHA-256 over each release artifact. SHA256SUMS gets attached
      # to the GitHub release as a convenience for users downloading the
      # binary directly (without npx).
      - name: Generate SHA256SUMS
        run: |
          (cd artifacts && find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec sha256sum {} + ) > SHA256SUMS
          # Strip leading "./<dir>/" so filenames in SHA256SUMS match what
          # users download from the release page (basename only).
          sed -i 's|  \./[^/]*/|  |' SHA256SUMS
          echo "---SHA256SUMS---"
          cat SHA256SUMS

      # Bake the expected hashes into the npm package itself, before publish.
      # This anchors the integrity chain in the npm-provenance-signed package
      # rather than in the same GitHub channel as the archive — closing the
      # "MITM swaps both files together" gap that an out-of-band SHA256SUMS
      # would have. binary.ts reads filename + sha256 from binaries.json
      # instead of constructing them and fetching a sibling SUMS file.
      - name: Bake binary hashes into npm package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re, pathlib
          version = os.environ["VERSION"]
          out = {"version": version, "binaries": {}}
          for line in pathlib.Path("SHA256SUMS").read_text().strip().splitlines():
              m = re.match(r"^([0-9a-fA-F]{64})\s+\*?(.+)$", line.strip())
              if not m:
                  continue
              sha = m.group(1).lower()
              name = m.group(2).strip()
              if "linux-x64" in name and name.endswith(".tar.gz"):
                  out["binaries"]["linux-x64"] = {"filename": name, "sha256": sha}
              elif "windows-x64" in name and name.endswith(".zip"):
                  out["binaries"]["windows-x64"] = {"filename": name, "sha256": sha}
          missing = [k for k in ("linux-x64", "windows-x64") if k not in out["binaries"]]
          if missing:
              raise SystemExit(f"missing entries for: {missing}")
          pathlib.Path("mcp-server/binaries.json").write_text(
              json.dumps(out, indent=2) + "\n"
          )
          print(json.dumps(out, indent=2))
          PY

      # Order matters: create the GitHub release (with binaries + checksums
      # attached) BEFORE publishing to npm. The npm package's ensureBinary()
      # lazily downloads the matching binary from the v<version> GH release
      # on first run. If npm publish happened first, `npx @mtuska/ue-trace-
      # mcp@<new>` would 404 trying to fetch the binary or SHA256SUMS.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v${{ needs.validate.outputs.version }}"
          notes_file=$(mktemp)
          cat >"$notes_file" <<EOF
          # ue-trace-mcp $version

          ## Install

          \`\`\`
          npx @mtuska/ue-trace-mcp@${{ needs.validate.outputs.version }}
          \`\`\`

          On first run the package downloads the matching TraceDigest binary
          (~10 MB) into \`~/.cache/ue-trace-mcp/${{ needs.validate.outputs.version }}/\`,
          verifies its SHA-256 against the \`SHA256SUMS\` attached to this
          release, and reuses the cached copy thereafter. Set
          \`TRACE_DIGEST_BIN\` to override with a locally-built binary.

          Binaries below are built against **UE 5.7**. They may not load
          against older or newer engine versions — engine binary compatibility
          is not guaranteed across minor releases.

          See the [README](https://github.com/mtuska/ue-trace-mcp#readme) for
          the full setup.
          EOF
          gh release create "$version" \
            --title "$version" \
            --notes-file "$notes_file" \
            artifacts/*/*.tar.gz \
            artifacts/*/*.zip \
            SHA256SUMS

      # Trusted Publishing needs a fairly recent npm — the ID-token exchange
      # only landed in npm 11.x. The shipped npm on ubuntu-latest is usually
      # fine, but pin to latest to be safe and to keep `--provenance` cheap.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # prepublishOnly in package.json runs lint+test+build, so we don't have
      # to re-run them explicitly. `--access public` is required for unscoped
      # public packages on npm (defaults to private otherwise for new ones).
      # `--provenance` attaches a signed build attestation that the package
      # came from this workflow on this commit — Trusted Publishing makes
      # this attestation free; the user can verify with `npm audit signatures`.
      - name: Publish to npm (Trusted Publishing via OIDC)
        working-directory: mcp-server
        run: npm publish --access public --provenance
