name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same ref when a new push arrives. PR pushes get a
# fresh run; the previous one (from a force-push or rebase) goes away.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Linux only. The TS surface is portable, npm behaviour doesn't meaningfully
# differ across OSes for our package, and the daemon path (Unix sockets +
# process.getuid) is POSIX-only. Windows is out anyway because mock-bin.mjs
# is invoked via shebang. macOS would just duplicate the ubuntu run.
jobs:
  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run lint

      - name: tests
        run: npm test

      - name: build
        run: npm run build

      # If `dist/` came out empty or `index.js` got dropped, the pack-and-ship
      # path is broken even if tests passed. Cheap sanity check.
      - name: verify dist
        run: node -e "require('fs').statSync('dist/index.js')"
